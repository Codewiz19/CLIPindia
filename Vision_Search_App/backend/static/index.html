<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClothIndia Vision Search</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --border: #e2e8f0;
      --ring: #c7d2fe;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 60px 0 40px;
    }
    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #1e1b4b, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Search Interface Card */
    .search-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow-md);
      margin-bottom: 40px;
    }

    /* Mode Tabs */
    .tabs {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* Inputs Grid */
    .input-layout {
      display: grid;
      gap: 20px;
      grid-template-columns: 1fr;
    }

    /* Drag & Drop Zone */
    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #f8fafc;
      position: relative;
      overflow: hidden;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--primary);
      background: #eff6ff;
    }
    .upload-zone svg {
      width: 40px;
      height: 40px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .upload-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .upload-hint {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    #image { display: none; }
    
    /* Image Preview in Dropzone */
    .preview-img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain;
      background: #f1f5f9;
      display: none;
      z-index: 10;
    }
    .remove-img {
      position: absolute;
      top: 10px; right: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 28px; height: 28px;
      font-size: 16px;
      cursor: pointer;
      display: none;
      z-index: 20;
    }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
    }
    input[type="text"], select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s;
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring);
    }

    /* Alpha Slider UI */
    .alpha-container {
      background: #f8fafc;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .alpha-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Toolbar (Bottom row of search card) */
    .toolbar {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 16px;
      margin-top: 24px;
    }
    .btn-search {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-search:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .btn-search:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    /* Results Area */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-weight: 600;
      color: var(--text-main);
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
    }
    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.2s;
    }
    .result-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-4px);
    }
    .result-img-wrapper {
      width: 100%;
      aspect-ratio: 3/4;
      background: #f1f5f9;
      position: relative;
    }
    .result-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .result-info {
      padding: 16px;
    }
    .result-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .result-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      background: #e0e7ff;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius);
      color: var(--text-muted);
    }

    /* Helpers */
    .hidden { display: none !important; }

    @media (max-width: 640px) {
      .toolbar { grid-template-columns: 1fr; }
      .header { padding: 40px 0 20px; }
      .header h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>ClothIndia Vision Search</h1>
      <p>High-speed multimodal local search powered by ONNX & FAISS</p>
    </header>

    <div class="search-card">
      <div class="tabs" id="modeTabs">
        <button class="tab active" data-mode="compositional">Multimodal (Image + Text)</button>
        <button class="tab" data-mode="text">Text Only</button>
        <button class="tab" data-mode="image">Image Only</button>
      </div>

      <div class="input-layout">
        <div class="form-group" id="imageInputGroup">
          <label>Reference Image</label>
          <div class="upload-zone" id="uploadZone">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <div class="upload-text">Click to upload or drag and drop</div>
            <div class="upload-hint">PNG, JPG up to 10MB</div>
            <input type="file" id="image" accept="image/*" />
            <img id="previewImg" class="preview-img" alt="Preview" />
            <button id="removeImgBtn" class="remove-img" title="Remove image">×</button>
          </div>
        </div>

        <div class="form-group" id="textInputGroup">
          <label>Text Intent / Modifier</label>
          <input type="text" id="text" placeholder="e.g. 'same green kurta' or 'blue jeans casual'" />
        </div>

        <div class="form-group" id="alphaGroup">
          <label>Search Focus Weight</label>
          <div class="alpha-container">
            <div class="alpha-header">
              <span>More Text Focus</span>
              <span>More Image Focus</span>
            </div>
            <input id="alpha" type="range" min="0" max="1" step="0.05" value="0.65" />
            <div style="text-align: center; font-size: 0.8rem; color: #64748b; margin-top: 8px;">
              Alpha Value: <span id="alphaVal" style="font-weight: 600; color: #4f46e5;">0.65</span>
            </div>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <select id="topk">
          <option value="3">Top 3</option>
          <option value="5" selected>Top 5</option>
          <option value="10">Top 10</option>
        </select>
        
        <button id="searchBtn" class="btn-search">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          Run Search
        </button>
      </div>
    </div>

    <div id="resultsContainer">
      <div class="results-header" id="resultsHeader">
        <span>Search Results</span>
      </div>
      <div id="results" class="results-grid">
        <div class="empty-state" style="grid-column: 1 / -1;">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="#cbd5e1" style="margin-bottom: 16px;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
          <p>Run a search to see visual results here.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- DOM Elements ---
    const byId = (id) => document.getElementById(id);
    const modeTabs = document.querySelectorAll('.tab');
    
    // Inputs & Groups
    const imageInputGroup = byId('imageInputGroup');
    const textInputGroup = byId('textInputGroup');
    const alphaGroup = byId('alphaGroup');
    
    // Controls
    const imageInput = byId('image');
    const textInput = byId('text');
    const alphaSlider = byId('alpha');
    const alphaVal = byId('alphaVal');
    const topkSelect = byId('topk');
    const searchBtn = byId('searchBtn');
    
    // Drag & Drop
    const uploadZone = byId('uploadZone');
    const previewImg = byId('previewImg');
    const removeImgBtn = byId('removeImgBtn');
    
    // Results
    const resultsGrid = byId('results');
    const resultsHeader = byId('resultsHeader');

    // State
    let currentMode = 'compositional';
    let selectedFile = null;

    // --- Tab Switching & UI Logic ---
    modeTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        // Update active class
        modeTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        currentMode = tab.dataset.mode;
        
        // Show/Hide logic based on mode
        if (currentMode === 'compositional') {
          imageInputGroup.classList.remove('hidden');
          textInputGroup.classList.remove('hidden');
          alphaGroup.classList.remove('hidden');
        } else if (currentMode === 'image') {
          imageInputGroup.classList.remove('hidden');
          textInputGroup.classList.add('hidden');
          alphaGroup.classList.add('hidden');
        } else if (currentMode === 'text') {
          imageInputGroup.classList.add('hidden');
          textInputGroup.classList.remove('hidden');
          alphaGroup.classList.add('hidden');
        }
      });
    });

    // Update Alpha Text
    alphaSlider.addEventListener('input', () => {
      alphaVal.textContent = alphaSlider.value;
    });

    // --- Drag and Drop File Logic ---
    uploadZone.addEventListener('click', () => imageInput.click());
    
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        handleFileSelect(e.dataTransfer.files[0]);
      }
    });
    
    imageInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFileSelect(e.target.files[0]);
    });

    function handleFileSelect(file) {
      if (!file.type.startsWith('image/')) {
        alert('Please select an image file.');
        return;
      }
      selectedFile = file;
      const url = URL.createObjectURL(file);
      previewImg.src = url;
      previewImg.style.display = 'block';
      removeImgBtn.style.display = 'block';
    }

    removeImgBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // Prevent triggering upload zone click
      selectedFile = null;
      imageInput.value = '';
      previewImg.style.display = 'none';
      previewImg.src = '';
      removeImgBtn.style.display = 'none';
    });

    // --- Search Card Rendering ---
    function createResultCard(item) {
      const p = item.preview_path || item.source_path || '';
      const isImage = /\.(jpg|jpeg|png|webp|bmp|gif)$/i.test(p);
      const imgSrc = isImage ? `/media?path=${encodeURIComponent(p)}` : '';
      
      return `
        <div class="result-card">
          <div class="result-img-wrapper">
            ${isImage ? `<img src="${imgSrc}" alt="result" loading="lazy" />` : ''}
          </div>
          <div class="result-info">
            <div class="result-title" title="${item.title || 'Fashion Item'}">${item.title || 'Fashion Item'}</div>
            <div class="result-meta">${item.category || 'Apparel'} • ${item.color || 'Mixed'}</div>
            <div class="result-badge">Score: ${Number(item.score).toFixed(3)}</div>
          </div>
        </div>`;
    }

    // --- Search Execution ---
    async function runSearch() {
      // Validation
      if (currentMode !== 'text' && !selectedFile) {
        alert('Please upload a reference image for this mode.');
        return;
      }
      if (currentMode !== 'image' && !textInput.value.trim()) {
        alert('Please enter a text intent for this mode.');
        textInput.focus();
        return;
      }

      // UI Loading State
      searchBtn.disabled = true;
      searchBtn.innerHTML = 'Searching...';
      resultsGrid.innerHTML = `
        <div class="empty-state" style="grid-column: 1 / -1;">
          <p>Analyzing embeddings and querying FAISS...</p>
        </div>`;
      resultsHeader.innerHTML = `<span>Searching...</span>`;

      // Build Form Data
      const form = new FormData();
      form.append('top_k', topkSelect.value);

      let endpoint = '/search/compositional';
      if (currentMode === 'image') endpoint = '/search/image';
      if (currentMode === 'text') endpoint = '/search/text';

      if (currentMode !== 'text') form.append('image', selectedFile);
      if (currentMode !== 'image') form.append('text', textInput.value.trim());
      if (currentMode === 'compositional') {
        form.append('text_intent', textInput.value.trim()); // To match backend specs
        form.append('alpha', alphaSlider.value);
      }

      // Execute API Call
      try {
        const res = await fetch(endpoint, { method: 'POST', body: form });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.detail || 'Search failed');
        
        if (!data.results?.length) {
          resultsHeader.innerHTML = `<span>No matches found</span>`;
          resultsGrid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <p>No visually similar results found. Try adjusting your text intent or alpha.</p>
            </div>`;
        } else {
          resultsHeader.innerHTML = `<span>Showing ${data.results.length} results</span><span style="font-size:12px;color:var(--text-muted)">Mode: ${data.query_mode}</span>`;
          resultsGrid.innerHTML = data.results.map(createResultCard).join('');
        }
      } catch (e) {
        resultsHeader.innerHTML = `<span style="color:#ef4444;">Search Error</span>`;
        resultsGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1; border-color:#fca5a5; background:#fef2f2; color:#b91c1c;">
            <p>${e.message}</p>
          </div>`;
      } finally {
        searchBtn.disabled = false;
        searchBtn.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          Run Search
        `;
      }
    }

    searchBtn.addEventListener('click', runSearch);
    
    // Allow 'Enter' key to trigger search in text input
    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') runSearch();
    });
  </script>
</body>
</html>
