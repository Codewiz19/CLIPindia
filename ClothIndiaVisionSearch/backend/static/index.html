<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClothIndia Vision Search</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1e2330;
      --muted: #677085;
      --accent: #5b7cff;
      --border: #e8ebf4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 1050px;
      margin: 32px auto;
      padding: 0 16px;
    }
    .title {
      font-size: 28px;
      margin: 0 0 8px;
      letter-spacing: .2px;
    }
    .subtitle { color: var(--muted); margin: 0 0 22px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 24px rgba(20,30,55,.05);
    }
    .grid { display: grid; gap: 12px; }
    .controls {
      display: grid;
      grid-template-columns: repeat(6, minmax(0,1fr));
      gap: 10px;
      align-items: center;
    }
    .controls > * { min-width: 0; }
    input, select, button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
    }
    input[type="range"] { padding: 0; }
    button {
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .hint { font-size: 12px; color: var(--muted); }
    .results {
      margin-top: 18px;
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
    }
    .item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
    }
    .thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      background: #f1f4fb;
    }
    .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .score { font-size: 12px; color: #3858d6; font-weight: 600; }
    @media (max-width: 860px) {
      .controls { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">ClothIndia Vision Search</h1>
    <p class="subtitle">Minimal local search with ONNX + FAISS CPU (image, text, compositional).</p>

    <div class="card grid">
      <div class="controls">
        <select id="mode">
          <option value="compositional">Image + text (recommended)</option>
          <option value="image">Image only</option>
          <option value="text">Text only</option>
        </select>

        <input id="image" type="file" accept="image/*" />
        <input id="text" type="text" placeholder="same green kurta" />

        <select id="topk">
          <option value="3">Top 3</option>
          <option value="5" selected>Top 5</option>
        </select>

        <div>
          <input id="alpha" type="range" min="0" max="1" step="0.05" value="0.65" />
          <div class="hint">alpha: <span id="alphaVal">0.65</span></div>
        </div>

        <button id="searchBtn">Search</button>
      </div>
      <div class="hint">Tip: Upload blue kurta image and type “same green kurta”.</div>
    </div>

    <div id="results" class="results"></div>
  </div>

  <script>
    const byId = (id) => document.getElementById(id);
    const mode = byId('mode');
    const image = byId('image');
    const text = byId('text');
    const topk = byId('topk');
    const alpha = byId('alpha');
    const alphaVal = byId('alphaVal');
    const searchBtn = byId('searchBtn');
    const results = byId('results');

    alpha.addEventListener('input', () => alphaVal.textContent = alpha.value);

    function card(item) {
      const p = item.preview_path || item.source_path || '';
      const isImage = /\.(jpg|jpeg|png|webp)$/i.test(p);
      return `
        <div class="item">
          ${isImage ? `<img class="thumb" src="file:///${p.replaceAll('\\\\','/')}" alt="result" />` : '<div class="thumb"></div>'}
          <div><strong>${item.title || 'fashion item'}</strong></div>
          <div class="meta">${item.media_type}${item.timestamp_sec != null ? ` • ${item.timestamp_sec.toFixed(1)}s` : ''}</div>
          <div class="meta">${item.category || 'fashion'} • ${item.color || 'unknown'}</div>
          <div class="score">score: ${Number(item.score).toFixed(4)}</div>
        </div>`;
    }

    async function runSearch() {
      searchBtn.disabled = true;
      results.innerHTML = '';

      const m = mode.value;
      const form = new FormData();
      form.append('top_k', topk.value);

      let endpoint = '/search/compositional';
      if (m === 'image') endpoint = '/search/image';
      if (m === 'text') endpoint = '/search/text';

      if (m !== 'text') {
        if (!image.files.length) {
          alert('Please choose an image.');
          searchBtn.disabled = false;
          return;
        }
        form.append('image', image.files[0]);
      }
      if (m !== 'image') {
        if (!text.value.trim()) {
          alert('Please enter text query/intent.');
          searchBtn.disabled = false;
          return;
        }
      }

      if (m === 'text') form.append('text', text.value.trim());
      if (m === 'compositional') {
        form.append('text_intent', text.value.trim());
        form.append('alpha', alpha.value);
      }

      try {
        const res = await fetch(endpoint, { method: 'POST', body: form });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Search failed');
        if (!data.results?.length) {
          results.innerHTML = '<div class="meta">No results found.</div>';
        } else {
          results.innerHTML = data.results.map(card).join('');
        }
      } catch (e) {
        results.innerHTML = `<div class="meta">${e.message}</div>`;
      } finally {
        searchBtn.disabled = false;
      }
    }

    searchBtn.addEventListener('click', runSearch);
  </script>
</body>
</html>
